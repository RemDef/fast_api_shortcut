services:          # список контейнеров
  db:
    image: postgres:16          # готовый образ, свой Dockerfile не нужен
    environment:                # переменные внутри контейнера
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5433:5432"            # хост:контейнер — чтобы с Windows стучаться в PG
    volumes:
      - pgdata:/var/lib/postgresql/data   # данные не пропадут после down
    healthcheck:                # "БД реально готова принимать коннекты?"
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .                    # собрать образ из Dockerfile в текущей папке
    ports:
      - "7995:7995"             # как у тебя uvicorn
    env_file:
      - .env                    # подтянуть файл (JWT и т.д.)
    environment:
      DB_URL: postgresql+asyncpg://app:app@db:5432/app
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy   # ждать, пока db пройдёт healthcheck
      redis:
        condition: service_healthy

volumes:           # именованные тома (данные Postgres переживают перезапуск)
  pgdata: